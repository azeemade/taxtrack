name: 🚀 Deploy update on merge to develop
on:
  push:
    branches:
      - develop
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.jkp.mje.mybluehost.me
          username: developer@api.taxtrack.sbscuk.co.uk
          password: ${{ secrets.password }}

      - name: Set up authentication and test access
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Setting up authentication..."
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"

          echo "Testing token access to Damoscky/taxtrack-api..."
          echo "Token length: ${#PERSONAL_ACCESS_TOKEN}"
          echo "Token starts with: ${PERSONAL_ACCESS_TOKEN:0:8}..."

          # Test API access
          echo "Testing API access..."
          API_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
                               -H "Accept: application/vnd.github.v3+json" \
                               https://api.github.com/repos/Damoscky/taxtrack-api)

          echo "Full API Response: $API_RESPONSE"

          if echo "$API_RESPONSE" | grep -q '"message"'; then
            echo "API Error: $(echo "$API_RESPONSE" | grep -o '"message":"[^"]*"' | cut -d'"' -f4)"
            exit 1
          else
            echo "API Success: Repository found"
            echo "Repository name: $(echo "$API_RESPONSE" | grep -o '"name":"[^"]*"' | cut -d'"' -f4)"
            echo "Repository visibility: $(echo "$API_RESPONSE" | grep -o '"visibility":"[^"]*"' | cut -d'"' -f4)"
          fi

          # Test alternative repository names
          echo "Testing alternative repository names..."
          for repo_name in "taxtrack" "taxtrack-api" "taxtrack_api"; do
            echo "Testing Damoscky/$repo_name..."
            ALT_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
                                -H "Accept: application/vnd.github.v3+json" \
                                https://api.github.com/repos/Damoscky/$repo_name)
            if ! echo "$ALT_RESPONSE" | grep -q '"message"'; then
              echo "Found repository: Damoscky/$repo_name"
              break
            fi
          done

          # List all repositories the token has access to
          echo "Listing repositories accessible with this token..."
          REPOS_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
                               -H "Accept: application/vnd.github.v3+json" \
                               https://api.github.com/user/repos?per_page=100)
          echo "Repositories: $(echo "$REPOS_RESPONSE" | grep -o '"full_name":"[^"]*"' | head -10)"

          # Set up git remote with token (use username:token format for private repos)
          echo "Setting up git remote..."
          git remote add master_repo https://${PERSONAL_ACCESS_TOKEN}@github.com/Damoscky/taxtrack-api.git
          git remote set-url master_repo https://${PERSONAL_ACCESS_TOKEN}@github.com/Damoscky/taxtrack-api.git

          # Test git access
          echo "Testing git access..."
          git ls-remote master_repo HEAD || echo "Git access failed"

      - name: 🔄 Sync to master repo
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Attempting to sync to master repository..."

          # Test direct clone first to isolate the issue
          echo "Testing direct clone..."
          if git clone https://${PERSONAL_ACCESS_TOKEN}@github.com/Damoscky/taxtrack-api.git test-clone; then
            echo "✅ Direct clone successful"
            rm -rf test-clone
          else
            echo "❌ Direct clone failed"
          fi

          # Try alternative: Use git push with full URL
          echo "Trying direct push with URL..."
          if git push https://${PERSONAL_ACCESS_TOKEN}@github.com/Damoscky/taxtrack-api.git develop:develop; then
            echo "✅ Direct push successful"
            exit 0
          fi

          # Try with different authentication format
          echo "Trying with x-access-token format..."
          if git push https://x-access-token:${PERSONAL_ACCESS_TOKEN}@github.com/Damoscky/taxtrack-api.git develop:develop; then
            echo "✅ X-access-token push successful"
            exit 0
          fi

          # Try using GitHub's built-in GITHUB_TOKEN
          echo "Trying with GITHUB_TOKEN..."
          if git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Damoscky/taxtrack-api.git develop:develop; then
            echo "✅ GITHUB_TOKEN push successful"
            exit 0
          fi

          echo "❌ All push methods failed"
          echo "Let's check what's happening with the repository access..."

          # Debug: Check if we can access the repo via different methods
          echo "Checking repository access methods..."
          echo "1. API access (should work):"
          curl -s -H "Authorization: token ${PERSONAL_ACCESS_TOKEN}" https://api.github.com/repos/Damoscky/taxtrack-api | grep -E '"name"|"private"|"permissions"'

          echo "2. Git protocol test:"
          git ls-remote https://${PERSONAL_ACCESS_TOKEN}@github.com/Damoscky/taxtrack-api.git HEAD || echo "Git protocol failed"

          exit 1
